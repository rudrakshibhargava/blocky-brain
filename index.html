<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blocky Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">

<!-- React, ReactDOM, and Babel loaded directly from CDN so this file works with no install/build step -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<style>
  :root{
    --sky-top:#5CC1F0;
    --sky-bottom:#9FE3F5;
    --grass:#3FAE3A;
    --grass-dark:#2E8A2A;
    --brick:#C9622A;
    --brick-dark:#9C4A1E;
    --coin:#FFD84D;
    --panel:#FFF8E7;
    --ink:#2B2140;
    --ink-soft:#6B6280;
    --red:#E63946;
    --red-dark:#C22733;
    --blue:#3B6FE0;
    --blue-dark:#2A54B5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      linear-gradient(var(--sky-top), var(--sky-bottom) 55%, var(--grass) 55%, var(--grass-dark) 100%);
    color:var(--ink);
    font-family:'Baloo 2', sans-serif;
    overflow-x:hidden;
  }
  #root{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    flex-direction:column; padding:36px 16px; position:relative;
  }

  /* decorative pixel clouds */
  .cloud{
    position:absolute; background:#fff; border-radius:40px; opacity:0.9;
  }
  .cloud::before, .cloud::after{content:""; position:absolute; background:#fff; border-radius:40px;}
  .c1{width:70px; height:26px; top:40px; left:8%;}
  .c1::before{width:34px; height:34px; top:-16px; left:8px; border-radius:50%;}
  .c1::after{width:26px; height:26px; top:-12px; left:36px; border-radius:50%;}
  .c2{width:90px; height:30px; top:90px; right:6%;}
  .c2::before{width:40px; height:40px; top:-18px; left:12px; border-radius:50%;}
  .c2::after{width:30px; height:30px; top:-12px; left:48px; border-radius:50%;}

  h1{
    font-family:'Press Start 2P', monospace; font-size:22px; margin:0 0 6px;
    text-align:center; color:#fff; text-shadow:3px 3px 0 var(--red-dark), -1px -1px 0 var(--ink);
    letter-spacing:1px; z-index:1;
  }
  p.subtitle{
    font-weight:700; color:var(--ink); background:var(--panel); padding:6px 16px;
    border-radius:100px; margin:0 0 20px; font-size:14px; text-align:center;
    border:3px solid var(--ink); z-index:1;
  }

  .stats{display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; justify-content:center; z-index:1;}
  .stat{
    background:var(--panel); border:3px solid var(--ink); border-radius:12px;
    padding:8px 18px; text-align:center; min-width:84px; box-shadow:3px 3px 0 rgba(0,0,0,0.25);
  }
  .stat .val{font-family:'Press Start 2P', monospace; font-size:15px; color:var(--red);}
  .stat .lbl{font-size:11px; text-transform:uppercase; color:var(--ink-soft); font-weight:800; margin-top:4px;}

  .board{
    display:grid; grid-template-columns:repeat(4, 84px); grid-gap:14px;
    margin-bottom:24px; z-index:1;
  }
  .card{width:84px; height:84px; cursor:pointer; perspective:600px;}
  .card-inner{
    width:100%; height:100%; position:relative; transform-style:preserve-3d;
    transition:transform .4s cubic-bezier(.2,.9,.3,1); border-radius:10px;
  }
  .card-face{
    position:absolute; inset:0; border-radius:10px; display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden; font-size:34px; border:3px solid var(--ink);
  }
  .card-back{
    background:linear-gradient(160deg, var(--coin), #E8A93B);
    box-shadow:inset 0 0 0 4px rgba(255,255,255,0.35), 3px 3px 0 rgba(0,0,0,0.3);
  }
  .card-back span{
    font-family:'Press Start 2P', monospace; color:var(--ink); font-size:22px;
    text-shadow:1px 1px 0 rgba(255,255,255,0.4);
  }
  .card-front{background:var(--panel); transform:rotateY(180deg);}
  .card-front.matched{background:#DFF5DA; border-color:var(--grass-dark);}

  .restart-btn{
    font-family:'Press Start 2P', monospace; background:var(--red); color:#fff; border:3px solid var(--ink);
    padding:14px 26px; border-radius:12px; font-size:13px; cursor:pointer;
    box-shadow:4px 4px 0 rgba(0,0,0,0.3); transition:transform .1s, box-shadow .1s; z-index:1;
  }
  .restart-btn:hover{transform:translate(2px,2px); box-shadow:2px 2px 0 rgba(0,0,0,0.3);}

  .win-banner{
    margin-top:20px; background:var(--panel); border:3px solid var(--ink); border-radius:14px;
    padding:16px 26px; text-align:center; max-width:320px; box-shadow:4px 4px 0 rgba(0,0,0,0.25); z-index:1;
  }
  .win-banner h2{font-family:'Press Start 2P', monospace; font-size:15px; margin:0 0 8px; color:var(--red);}
  .win-banner p{margin:0; font-size:14px; color:var(--ink-soft); font-weight:700;}

  @media(max-width:420px){
    .board{grid-template-columns:repeat(4, 70px); grid-gap:10px;}
    .card{width:70px; height:70px;}
    .card-face{font-size:28px;}
    h1{font-size:16px;}
  }
</style>
</head>
<body>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const ICONS = ["🍄", "⭐", "🪙", "🐢", "🔥", "🏰", "👑", "💎"];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function createDeck() {
  return shuffle([...ICONS, ...ICONS]).map((icon, i) => ({
    id: i, icon, isFlipped: false, isMatched: false,
  }));
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2, "0")}`;
}

function BlockyBrain() {
  const [cards, setCards] = useState(createDeck);
  const [flippedIds, setFlippedIds] = useState([]);
  const [moves, setMoves] = useState(0);
  const [seconds, setSeconds] = useState(0);
  const [running, setRunning] = useState(true);
  const [lockBoard, setLockBoard] = useState(false);

  const matchedCount = cards.filter((c) => c.isMatched).length / 2;
  const won = matchedCount === ICONS.length;

  useEffect(() => {
    if (!running || won) return;
    const t = setInterval(() => setSeconds((s) => s + 1), 1000);
    return () => clearInterval(t);
  }, [running, won]);

  useEffect(() => {
    if (won) setRunning(false);
  }, [won]);

  const restart = useCallback(() => {
    setCards(createDeck());
    setFlippedIds([]);
    setMoves(0);
    setSeconds(0);
    setRunning(true);
    setLockBoard(false);
  }, []);

  function flipCard(id) {
    if (lockBoard) return;
    const card = cards.find((c) => c.id === id);
    if (!card || card.isFlipped || card.isMatched) return;

    const nextCards = cards.map((c) => c.id === id ? { ...c, isFlipped: true } : c);
    setCards(nextCards);
    const nextFlipped = [...flippedIds, id];
    setFlippedIds(nextFlipped);

    if (nextFlipped.length === 2) {
      setMoves((m) => m + 1);
      setLockBoard(true);
      const [aId, bId] = nextFlipped;
      const a = nextCards.find((c) => c.id === aId);
      const b = nextCards.find((c) => c.id === bId);

      if (a.icon === b.icon) {
        setCards((prev) => prev.map((c) => (c.id === aId || c.id === bId) ? { ...c, isMatched: true } : c));
        setFlippedIds([]);
        setLockBoard(false);
      } else {
        setTimeout(() => {
          setCards((prev) => prev.map((c) => (c.id === aId || c.id === bId) ? { ...c, isFlipped: false } : c));
          setFlippedIds([]);
          setLockBoard(false);
        }, 800);
      }
    }
  }

  return (
    <React.Fragment>
      <h1>BLOCKY BRAIN</h1>
      <p className="subtitle">Flip two blocks and find the matching pair! 🎮</p>

      <div className="stats">
        <Stat label="Moves" value={moves} />
        <Stat label="Time" value={formatTime(seconds)} />
        <Stat label="Pairs" value={`${matchedCount}/${ICONS.length}`} />
      </div>

      <div className="board">
        {cards.map((card) => (
          <Card key={card.id} card={card} onClick={() => flipCard(card.id)} />
        ))}
      </div>

      <button className="restart-btn" onClick={restart}>NEW GAME</button>

      {won && (
        <div className="win-banner">
          <h2>LEVEL CLEAR!</h2>
          <p>You matched everything in {moves} moves and {formatTime(seconds)}. 🏆</p>
        </div>
      )}
    </React.Fragment>
  );
}

function Stat({ label, value }) {
  return (
    <div className="stat">
      <div className="val">{value}</div>
      <div className="lbl">{label}</div>
    </div>
  );
}

function Card({ card, onClick }) {
  const flippedOrMatched = card.isFlipped || card.isMatched;
  return (
    <div className="card" onClick={onClick}>
      <div className="card-inner" style={{ transform: flippedOrMatched ? "rotateY(180deg)" : "rotateY(0deg)" }}>
        <div className="card-face card-back"><span>?</span></div>
        <div className={`card-face card-front ${card.isMatched ? "matched" : ""}`}>
          {card.icon}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<BlockyBrain />);
</script>
</body>
</html>
